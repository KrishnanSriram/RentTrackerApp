# API gateway: routes by path, the same way an Application Load Balancer will in ECS.
# The React app only ever talks to this one address (http://localhost:8080 locally).

server {
    listen 8080;
    client_max_body_size 1m;

    # Docker's internal DNS; variables below make nginx resolve names per request,
    # so the gateway starts even if a service is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    location /api/auth        { set $u http://auth:8000;       proxy_pass $u; }
    location /api/properties  { set $u http://properties:8000; proxy_pass $u; }
    location /api/renters     { set $u http://renters:8000;    proxy_pass $u; }
    location /api/payments    { set $u http://payments:8000;   proxy_pass $u; }
    location /api/dashboard   { set $u http://dashboard:8000;  proxy_pass $u; }

    location = /health { default_type application/json; return 200 '{"status":"ok","service":"gateway"}'; }
    location /         { default_type application/json; return 404 '{"detail":"Not found"}'; }
}
